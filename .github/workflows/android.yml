name: Android build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Determine build type
        id: build_type
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_TYPE="release"
          else
            BUILD_TYPE="debug"
          fi
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "Build type: $BUILD_TYPE"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?GitHub secret KEYSTORE_BASE64 is required}"
          : "${STORE_PASSWORD:?GitHub secret STORE_PASSWORD is required}"
          : "${KEY_ALIAS:?GitHub secret KEY_ALIAS is required}"
          : "${KEY_PASSWORD:?GitHub secret KEY_PASSWORD is required}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          test -s release.jks
          chmod 600 release.jks

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"

      - name: Write build info
        run: |
          COMMIT_HASH="${{ github.sha }}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          mkdir -p app/src/main/java/com/example
          printf '%s\n' \
            'package com.example' \
            '' \
            'object BuildInfo {' \
            "    const val COMMIT_HASH: String = \"${COMMIT_HASH}\"" \
            "    const val BUILD_TIME: String = \"${BUILD_TIME}\"" \
            '}' > app/src/main/java/com/example/BuildInfo.kt

      - name: Build debug APK
        if: steps.build_type.outputs.build_type == 'debug' || steps.build_type.outputs.build_type == 'both'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: steps.build_type.outputs.build_type == 'debug' || steps.build_type.outputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: kopilka-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: steps.build_type.outputs.build_type == 'release' || steps.build_type.outputs.build_type == 'both'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK
        if: steps.build_type.outputs.build_type == 'release' || steps.build_type.outputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: kopilka-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14